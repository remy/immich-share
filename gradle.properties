# JVM args for the Gradle daemon. 4g suits CI runners and dev machines alike;
# the file.encoding flag keeps Kotlin source parsing stable across platforms.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is mandatory; the support library is long dead.
android.useAndroidX=true

# Only build the resources for the current variant during development.
android.nonTransitiveRClass=true

kotlin.code.style=official
