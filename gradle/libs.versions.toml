[versions]
# --- Toolchain --------------------------------------------------------------
# AGP 9.x has Kotlin support built in: there is no `org.jetbrains.kotlin.android`
# plugin to apply, and `kotlinOptions { }` has been replaced by `kotlin { }`.
# Gradle is pinned in gradle/wrapper/gradle-wrapper.properties and must stay
# within the range this AGP supports.
agp = "9.3.1"
kotlin = "2.4.10"
jvmTarget = "17"

# --- SDK levels -------------------------------------------------------------
# compileSdk only sets the API surface available at compile time, and the
# current stable AndroidX line (core-ktx 1.19, lifecycle 2.11, activity 1.13)
# refuses to compile against anything below 37. targetSdk stays at 36 because
# raising it opts the app in to new runtime behaviour, which needs testing on a
# device — a separate decision from compiling.
compileSdk = "37"
compileSdkMinor = "1"
minSdk = "26"
targetSdk = "36"
buildTools = "37.0.0"

# --- AndroidX ---------------------------------------------------------------
androidxCore = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.06.01"
datastore = "1.2.1"
work = "2.11.2"
# Required: the platform android.media.ExifInterface has no getDateTimeOriginal()
# and no HEIF support, both of which the upload path depends on.
exifinterface = "1.4.2"

# --- Networking / serialization ---------------------------------------------
okhttp = "5.4.0"
retrofit = "3.0.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"

# --- Images -----------------------------------------------------------------
coil = "3.5.0"

# --- Test -------------------------------------------------------------------
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Compose: versions come from the BOM, so the members are declared without one.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }

okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Still required under AGP 9: enabling `buildFeatures.compose` without it fails
# configuration ("the Compose Compiler Gradle plugin is required").
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
